services:
  db:
    container_name: postgres
    image: postgres:16.1-alpine
    restart: always
    ports:
      - "${PGPORT}:${PGPORT}"
    volumes:
      - data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${PGPASSWORD}
      - POSTGRES_DB=${PGDATABASE}
      - POSTGRES_USER=${PGUSER}

  redis:
    container_name: redis
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

